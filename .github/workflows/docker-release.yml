name: Docker Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: "1"

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Docker / Buildx setup
      # ------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------------------------
      # Version extraction
      # ------------------------------------------------------------
      - name: Extract version from Git tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          SHORT_SHA=$(git rev-parse --short HEAD)

          echo "full_version=$TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          echo "Release version: $TAG"
          echo "Commit SHA: $SHORT_SHA"

      # ------------------------------------------------------------
      # Build cafe-edge nginx image (amd64, for scan & publish)
      # ------------------------------------------------------------
      - name: Build cafe-edge:scan-local-nginx image (local, amd64)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -f nginx/Dockerfile \
            -t oleglod/cafe-edge:scan-local-nginx \
            .

      # ------------------------------------------------------------
      # Docker Scout installation
      # ------------------------------------------------------------
      - name: Install Docker Scout CLI
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh
          echo "$HOME/.docker/cli-plugins" >> $GITHUB_PATH
          docker scout version

      # ------------------------------------------------------------
      # Security scan (NON-BLOCKING - for information only)
      # ------------------------------------------------------------
      - name: Scan cafe-edge:scan-local-nginx image with Docker Scout
        continue-on-error: true
        run: |
          docker scout cves oleglod/cafe-edge:scan-local-nginx \
            --only-severity critical,high

      # ------------------------------------------------------------
      # Tag & publish images (amd64 only)
      # ------------------------------------------------------------

      - name: Tag & publish cafe-edge:nginx image (amd64)
        run: |
          docker tag oleglod/cafe-edge:scan-local-nginx oleglod/cafe-edge:${{ steps.version.outputs.full_version }}-nginx
          docker tag oleglod/cafe-edge:scan-local-nginx oleglod/cafe-edge:sha-${{ steps.version.outputs.short_sha }}-nginx
          docker tag oleglod/cafe-edge:scan-local-nginx oleglod/cafe-edge:latest-nginx
          docker push oleglod/cafe-edge:${{ steps.version.outputs.full_version }}-nginx
          docker push oleglod/cafe-edge:sha-${{ steps.version.outputs.short_sha }}-nginx
          docker push oleglod/cafe-edge:latest-nginx
